# --- Basics ---
set -g mouse on                      # click to switch/resize panes, scroll with trackpad
set -g history-limit 10000
set -g base-index 1                  # windows numbered from 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10                # faster response to key presses

# --- Splits (keep working dir when splitting) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Pane navigation without prefix: option/alt + arrow ---
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- Window navigation: option/alt + number ---
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# --- Colors ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# --- Status bar ---
set -g status-position top
set -g status-interval 5
set -g status-style bg=default,fg=colour245

set -g status-left-length 30
set -g status-left "#[fg=colour39,bold] #S #[fg=colour245]│ "

set -g window-status-format "#[fg=colour245]#I:#W"
set -g window-status-current-format "#[fg=colour39,bold]#I:#W*"
set -g window-status-separator "  "

set -g status-right-length 100
set -g status-right "#[fg=colour245]#(bash ~/.claude/tmux-git-status.sh '#{pane_current_path}') │ %a %d %b %H:%M "

# --- Pane borders: show current path ---
set -g pane-border-status top
set -g pane-border-format " #{pane_current_path} "
set -g pane-active-border-style fg=colour39
set -g pane-border-style fg=colour238
