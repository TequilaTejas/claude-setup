# --- High contrast dark theme ---
background              #000000
foreground              #ffffff
selection_background    #3391ff
selection_foreground    #000000
cursor                  #ffffff
cursor_text_color       #000000
cursor_shape            beam
cursor_blink_interval   0

# black
color0   #1a1a1a
color8   #6e6e6e
# red
color1   #ff3b3b
color9   #ff6e6e
# green
color2   #3ddc84
color10  #6cffb0
# yellow
color3   #ffd93b
color11  #ffe97f
# blue
color4   #4da6ff
color12  #7fc4ff
# magenta
color5   #ff6ec7
color13  #ff9edb
# cyan
color6   #3bdfff
color14  #7fefff
# white
color7   #e6e6e6
color15  #ffffff

url_color               #4da6ff

# --- Tab bar ---
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #000000
active_tab_background   #ffffff
inactive_tab_foreground #999999
inactive_tab_background #1a1a1a

# --- Readability / polish ---
background_opacity      1.0
window_padding_width     8
enable_audio_bell        no
scrollback_lines         10000

# --- Remote control (lets `wt`/scripts open new tabs in this instance) ---
allow_remote_control    yes
listen_on               unix:/tmp/kitty-{kitty_pid}

# --- "Needs attention" tab highlight ---
# Claude Code hooks (see ~/.claude/settings.json + ~/.claude/kitty-bell.sh) ring
# the bell in a window when it's waiting on you (permission prompt or turn done).
# A rung, unfocused window shows this symbol on its tab and bounces the dock icon,
# both clearing automatically once you switch to that tab.
bell_on_tab              "🔴 "
window_alert_on_bell     yes
macos_dock_badge_on_bell yes

# --- Tabs behave like browser tabs: Cmd+1..5 jump directly to that tab ---
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+t new_tab_with_cwd
map cmd+w close_window
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab

# --- Side-by-side splits within a tab (VS Code / iTerm style) ---
enabled_layouts splits, tall, stack
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+shift+w close_tab
